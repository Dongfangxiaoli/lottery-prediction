[tool.poetry]
name = "lottery-prediction"
version = "0.10.0"
description = "五种彩票样本外评估与选号工具"
authors = ["bairuchang"]
readme = "README.md"
license = "MIT"
maintainers = ["Dongfangxiaoli"]
repository = "https://github.com/Dongfangxiaoli/lottery-prediction"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
torch = {version = "^2.5.0", source = "torch"}
pandas = "^2.2.3"
numpy = "^2.1.3"
scikit-learn = "^1.5.2"
scipy = ">=1.14"
xgboost = "3.4.1"
matplotlib = "^3.9.2"
seaborn = "^0.13.2"
gradio = "6.26.0"
requests = "^2.32.0"
beautifulsoup4 = "^4.12.3"
lxml = "^5.3.0"
tqdm = "^4.67.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "tsinghua"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"
priority = "primary"

[[tool.poetry.source]]
name = "torch"
url = "https://download.pytorch.org/whl/cu124"
priority = "supplemental"
